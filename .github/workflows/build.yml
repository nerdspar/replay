name: Build add-on images

# Publishing prebuilt images is what makes an update a `docker pull` — seconds,
# with a progress bar — instead of Home Assistant compiling better-sqlite3 from
# source on the user's box with no visible output.
on:
  push:
    branches: [main]
    paths:
      - 'cartridge_player/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'cartridge_player/**'
  workflow_dispatch:

# A newer push supersedes an older run. Without this they race, and a slow or
# hung older run can publish one architecture after the newer one already did.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing gets published unless the code is actually sound.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: cartridge_player/app/server
        run: npm ci

      - name: Install web dependencies
        working-directory: cartridge_player/app/web
        run: npm ci

      - name: Typecheck server
        working-directory: cartridge_player/app/server
        run: npm run typecheck

      - name: Test server
        working-directory: cartridge_player/app/server
        run: npm test

      - name: Test web
        working-directory: cartridge_player/app/web
        run: npm test

      - name: Build web
        working-directory: cartridge_player/app/web
        run: npm run build

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    # These normally finish in about four minutes. One aarch64 job hung in the
    # builder for 25+ minutes and had to be spotted by hand — during which the
    # release was half-published (amd64 up, aarch64 missing), which is exactly
    # the state that makes Home Assistant fail an update with "unknown error".
    # Fail loudly instead of hanging.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Must match `arch` in cartridge_player/config.yaml. armv7 is absent
        # because Home Assistant's builder no longer accepts it — it fails with
        # "Argument '--armv7' unknown". Add-on builds are 64-bit only now.
        arch: [aarch64, amd64]

    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: meta
        run: |
          version="$(grep -E '^version:' cartridge_player/config.yaml | cut -d'"' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Add-on version: ${version}"

      # Lets the aarch64 and armv7 images build on an amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and publish' || '' }}
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/cartridge_player \
            --addon \
            ${{ github.event_name == 'pull_request' && '--test' || '' }}
