name: Build add-on images

# Publishing prebuilt images is what makes an update a `docker pull` — seconds,
# with a progress bar — instead of Home Assistant compiling better-sqlite3 from
# source on the user's box with no visible output.
on:
  push:
    branches: [main]
    paths:
      - 'cartridge_player/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'cartridge_player/**'
  workflow_dispatch:

# A newer push supersedes an older run. Without this they race, and a slow or
# hung older run can publish one architecture after the newer one already did.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing gets published unless the code is actually sound.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: cartridge_player/app/server
        run: npm ci

      - name: Install web dependencies
        working-directory: cartridge_player/app/web
        run: npm ci

      - name: Typecheck server
        working-directory: cartridge_player/app/server
        run: npm run typecheck

      - name: Test server
        working-directory: cartridge_player/app/server
        run: npm test

      - name: Test web
        working-directory: cartridge_player/app/web
        run: npm test

      - name: Build server
        working-directory: cartridge_player/app/server
        run: npm run build

      - name: Build web
        working-directory: cartridge_player/app/web
        run: npm run build

      # The image copies this in rather than compiling inside an emulated ARM
      # container. tsc and vite emit identical output on every architecture, and
      # emulating that install reliably hung.
      - name: Share the compiled output with the image builds
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cartridge_player/app/*/dist
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    # Each architecture builds on its OWN architecture. See the matrix below.
    runs-on: ${{ matrix.runner }}
    # These normally finish in about four minutes. One aarch64 job hung in the
    # builder for 25+ minutes and had to be spotted by hand — during which the
    # release was half-published (amd64 up, aarch64 missing), which is exactly
    # the state that makes Home Assistant fail an update with "unknown error".
    # Fail loudly instead of hanging.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Must match `arch` in cartridge_player/config.yaml. armv7 is absent
        # because Home Assistant's builder no longer accepts it — it fails with
        # "Argument '--armv7' unknown". Add-on builds are 64-bit only now.
        #
        # aarch64 builds on a real ARM runner rather than under QEMU. The image
        # compiles better-sqlite3 from source, and that native build is what
        # emulation could not do reliably: first a 25-minute hang, then
        # "Illegal instruction (core dumped)" — a QEMU fault, not a code one, so
        # nothing in the source could have prevented it. Both left the release
        # half-published, amd64 up and aarch64 missing, which is the state that
        # makes a Home Assistant update fail with "unknown error".
        #
        # GitHub's ARM runners are free for public repositories.
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Collect the compiled output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: cartridge_player/app

      - name: Confirm the build context has what the image needs
        run: |
          test -f cartridge_player/app/server/dist/index.js
          test -f cartridge_player/app/web/dist/index.html
          echo "compiled output present"

      - name: Read the add-on's version, name and description
        id: meta
        run: |
          set -euo pipefail
          # Quoting in config.yaml is inconsistent — `version` is quoted and
          # `name` is not — and `cut -d'"'` silently returns the WHOLE LINE
          # when there is no quote to cut on. This copes with either.
          field() {
            grep -E "^$1:" cartridge_player/config.yaml \
              | sed -E "s/^$1:[[:space:]]*\"?([^\"]*)\"?[[:space:]]*$/\\1/"
          }
          version="$(field version)"
          test -n "$version"
          {
            echo "version=${version}"
            echo "name=$(field name)"
            echo "description=$(field description)"
          } >> "$GITHUB_OUTPUT"
          echo "Add-on version: ${version}"

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built with plain docker rather than home-assistant/builder.
      #
      # That action is distributed as an amd64 image and drives QEMU itself, so
      # it cannot run on an ARM runner at all — it fails with "exec format
      # error". Since the point of the ARM runner is to stop emulating, the
      # action had to go with it.
      #
      # What it did for us is not much: a docker build against the base image in
      # build.yaml, plus the io.hass.* labels the Supervisor reads. Both are
      # reproduced here, and each architecture now builds on its own.
      - name: Build the image
        id: image
        run: |
          set -euo pipefail
          arch='${{ matrix.arch }}'
          version='${{ steps.meta.outputs.version }}'
          base="$(awk -v a="$arch" '$1 == a":" { print $2 }' cartridge_player/build.yaml)"
          image="ghcr.io/${{ github.repository }}/${arch}-cartridge-player"

          test -n "$base" || { echo "no base image for ${arch} in build.yaml"; exit 1; }
          echo "base: ${base}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

          docker build \
            --build-arg "BUILD_FROM=${base}" \
            --label "io.hass.arch=${arch}" \
            --label "io.hass.type=addon" \
            --label "io.hass.version=${version}" \
            --label "io.hass.name=${{ steps.meta.outputs.name }}" \
            --label "io.hass.description=${{ steps.meta.outputs.description }}" \
            --label "io.hass.url=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "${image}:${version}" \
            -t "${image}:latest" \
            cartridge_player

      # The Supervisor reads these to decide what an image is and whether it is
      # newer than what is installed. A missing or stale io.hass.version is an
      # update that silently never appears.
      - name: Confirm the image is labelled as the Supervisor expects
        run: |
          set -euo pipefail
          got="$(docker inspect --format '{{index .Config.Labels "io.hass.version"}}' \
            '${{ steps.image.outputs.image }}:${{ steps.meta.outputs.version }}')"
          arch="$(docker inspect --format '{{index .Config.Labels "io.hass.arch"}}' \
            '${{ steps.image.outputs.image }}:${{ steps.meta.outputs.version }}')"
          type="$(docker inspect --format '{{index .Config.Labels "io.hass.type"}}' \
            '${{ steps.image.outputs.image }}:${{ steps.meta.outputs.version }}')"
          echo "version=${got} arch=${arch} type=${type}"
          test "$got" = '${{ steps.meta.outputs.version }}'
          test "$arch" = '${{ matrix.arch }}'
          test "$type" = 'addon'

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker push '${{ steps.image.outputs.image }}:${{ steps.meta.outputs.version }}'
          docker push '${{ steps.image.outputs.image }}:latest'
