name: Cartridge Player
version: "0.5.1"
slug: cartridge_player
# Prebuilt by CI, so an update is a pull with a progress bar rather than
# Home Assistant compiling better-sqlite3 on the user's own machine.
image: ghcr.io/nerdspar/replay/{arch}-cartridge-player
description: Tap NFC cartridges to launch shows on your TV
url: https://github.com/nerdspar/replay
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:filmstrip-box
panel_title: Cartridges
hassio_api: true
homeassistant_api: true
# Restarts the add-on if it stops serving HTTP. [HOST] is the container on
# Supervisor's internal network, so this addresses the ingress port directly
# rather than going through a published port mapping that does not exist.
watchdog: http://[HOST]:8099/health
options:
  direct_port: 0
schema:
  direct_port: int(0,65535)
# LAN-direct mode is an escape hatch, not the documented default (see README).
# Supervisor port maps must be static, so the container-side direct port is fixed
# at 8100: set `direct_port: 8100` in Configuration and publish this port here.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: LAN-direct access — only listens when direct_port is set, and refuses to start without a PIN
