# Cartridge Player — NFC reader firmware
#
# Derived from TheStockPot/NFC-Cartridge-Player, repinned for ESP8266 (§2).
# The upstream prebuilt binaries are ESP32-C3/S3 and will NOT flash to an
# ESP8266 — compile this YAML.
#
# ONE FILE ON PURPOSE. It is installed through the ESPHome Builder web editor,
# which manages .yaml and nothing else, so a companion header would mean
# dropping to a file manager or SSH before the firmware could be installed.
#
# Pin map (§1.1). Hardware SPI on the ESP8266 is fixed; these are deliberate.
#   SPI CLK    GPIO14  D5
#   SPI MOSI   GPIO13  D7
#   SPI MISO   GPIO12  D6
#   RC522 CS   GPIO5   D1
#   SK6812 DIN GPIO4   D2
#
# Do NOT move anything to GPIO0/2/15/16. GPIO15 must be low at boot and RC522
# modules often pull it high, giving a board that silently refuses to start.
# GPIO1 is UART TX and collides with the serial logger.
#
# RC522 RST: leave unconnected IF your module has the pull-up on it — upstream's
# does, which is why their YAML has no `reset_pin` either. If yours does not,
# RST floats low, and since it is ACTIVE LOW the chip sits in power-down and
# cannot answer the soft reset ESPHome sends when no `reset_pin` is configured.
# Symptom: `[E][rc522] Reset command failed`, with wifi, uptime and the status
# light all working normally. Fix: one jumper from RST to 3V3.

# A SECOND READER IN THE SAME HOUSE. Copy this file and change BOTH names
# below; everything else is identical. They must differ, because Home Assistant
# derives each reader's entities and light actions from `device_name`, and two
# devices claiming one name collide on mDNS as well. That same string rides on
# every scan event, which is how the add-on tells one reader's taps from the
# other's.
substitutions:
  device_name: replay-cartridge-reader
  friendly_name: Replay Cartridge Reader

# RENAMING AN ALREADY-FLASHED READER. The device advertises itself by its old
# name until the moment the new firmware lands, so the install that performs a
# rename is the one that cannot find it — ESPHome looks for the NEW name and
# nothing answers. Uncomment this for that one install, pointing at the old name
# or the reader's IP, then comment it out again:
#
#   use_address: cartridge-reader.local
#
# Home Assistant will also keep the old device alongside the new one, its
# entities greyed out. Delete it from Settings > Devices once the rename lands.
#
# The `!secret` names below are deliberately NOT renamed: they are keys in your
# secrets.yaml, not properties of the device, and changing them here would mean
# editing that file for no gain.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    # -100 runs after every component is set up, so the light is real by now.
    priority: -100
    then:
      - script.execute: show_ambient

esp8266:
  board: d1_mini

logger:
  # GPIO1 (UART TX) is in use by the logger; keep it off the pin budget.
  level: INFO

api:
  encryption:
    key: !secret cartridge_reader_api_key

  # The reader knows a tag was read. It does NOT know whether that tag is
  # assigned, whether the TV accepted the deep link, or whether Music Assistant
  # found the album — only the add-on knows any of that, so the outcome states
  # are pushed in rather than guessed here.
  #
  # Needs ESPHome 2024.6 or newer for `actions:`. On older versions rename this
  # key to `services:` and `action:` to `service:`; nothing else changes.
  actions:
    - action: set_status
      variables:
        state: string
      then:
        # Any plain status drops a previous cartridge's artwork colour, so it
        # cannot linger onto the next one.
        - lambda: "id(accent_on) = false;"
        - script.execute:
            id: show_status
            state: !lambda "return state;"

    # As set_status, but wearing a colour this once instead of the palette's —
    # a playing cartridge showing the colour of its own artwork. `color` is six
    # hex characters, no hash.
    - action: set_status_color
      variables:
        state: string
        color: string
      then:
        - lambda: |-
            auto nibble = [](char c) -> int {
              if (c >= '0' && c <= '9') return c - '0';
              if (c >= 'a' && c <= 'f') return c - 'a' + 10;
              if (c >= 'A' && c <= 'F') return c - 'A' + 10;
              return -1;
            };

            id(accent_on) = false;
            if (color.length() != 6) return;

            int v[6];
            for (int n = 0; n < 6; n++) {
              v[n] = nibble(color[n]);
              if (v[n] < 0) return;
            }
            id(accent_r) = (v[0] * 16 + v[1]) / 255.0f;
            id(accent_g) = (v[2] * 16 + v[3]) / 255.0f;
            id(accent_b) = (v[4] * 16 + v[5]) / 255.0f;
            id(accent_on) = true;
        - script.execute:
            id: show_status
            state: !lambda "return state;"

    # Colours, chosen in the add-on. See `apply_palette` for the format.
    - action: set_palette
      variables:
        palette: string
      then:
        - script.execute:
            id: apply_palette
            packed: !lambda "return palette;"

  on_client_connected:
    then:
      - lambda: |-
          id(link_up) = true;
          id(ever_connected) = true;
      - script.execute: show_ambient
  on_client_disconnected:
    then:
      - lambda: "id(link_up) = false;"
      - script.execute: show_ambient

# No OTA password. A reader that changes hands should be updatable by whoever
# has it, without a secret being passed along with the hardware — and anyone who
# could reach this port is already on the home network.
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fixed, and deliberately the obvious one. This AP only exists when the reader
  # cannot find the network compiled into it — which is exactly what happens
  # when it moves house — and its whole job is to let whoever is holding it type
  # in the new wifi. A secret they would have to be told first defeats that.
  ap:
    ssid: "${friendly_name} Fallback"
    password: "12345678"
  on_connect:
    then:
      - lambda: "id(net_up) = true;"
      - script.execute: show_ambient
  on_disconnect:
    then:
      - lambda: |-
          id(net_up) = false;
          id(link_up) = false;
      - script.execute: show_ambient

captive_portal:

# ---------------------------------------------------------------------------
# Status light (§1.2)
#
# One SK6812 on D2. POWER IT FROM 3V3, NOT 5V. At 5V the chip wants ~0.7 x VDD
# = 3.5V to read a logic high and the ESP8266 drives 3.3V. That margin is
# negative on paper and works on the bench, which is the worst combination: it
# fails intermittently later, in a case, and looks like a loose wire.
#
# `bit_bang` because the two hardware methods are pinned to GPIO1 (the logger's
# UART TX) and GPIO2 (the onboard blue LED). Bit-banging blocks interrupts for
# the length of the write, which for ONE led is 24 bits x 1.25us = 30us — far
# too short to disturb wifi. That warning is about long strips.
#
# Built for the RGBW part. For a three-die RGB one set `type: GRB`; greys are
# then mixed from the colour dies instead of using the white one, which `paint`
# handles on its own. If red and green come out swapped, the part wants
# RGB/RGBW ordering instead.
#
# No `effects:` here. Breathing is driven by the `breathe` script, because the
# built-in pulse effect takes its brightness range at COMPILE time and these
# brightnesses are chosen by the user at runtime. Doing it in a script also
# retires the rule that a call may set an effect or a transition but not both.
# ---------------------------------------------------------------------------

light:
  - platform: neopixelbus
    id: status_led
    name: "Status Light"
    icon: mdi:led-on
    variant: SK6812
    type: GRBW
    pin: GPIO4
    num_leds: 1
    method:
      type: bit_bang
    restore_mode: ALWAYS_OFF
    # Linear, against ESPHome's default of 2.8.
    #
    # Gamma correction makes a dimmer track how the eye perceives brightness,
    # which is right for a lamp and wrong here. It collapses the bottom of the
    # range: at 2.8 a "6%" idle becomes 0.06^2.8 = 0.0004, which is 0.1 of 255
    # and rounds to OFF. The light was not dim, it was extinguished, and the
    # config still read as though it should glow.
    gamma_correct: 1.0
    default_transition_length: 0s

# ---------------------------------------------------------------------------
# Reader
# ---------------------------------------------------------------------------

spi:
  clk_pin: GPIO14
  miso_pin: GPIO12
  mosi_pin: GPIO13

globals:
  - id: current_uid
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: card_present
    type: bool
    restore_value: false
    initial_value: "false"

  # Connection state, tracked here rather than read out of the wifi and api
  # components, so the light does not depend on their internals.
  - id: net_up
    type: bool
    restore_value: false
    initial_value: "false"
  - id: link_up
    type: bool
    restore_value: false
    initial_value: "false"

  # The light is showing something that ambient must not overwrite.
  - id: holding
    type: bool
    restore_value: false
    initial_value: "false"
  # A tag event has been fired and nothing has answered it yet.
  - id: awaiting
    type: bool
    restore_value: false
    initial_value: "false"
  # Something answered THIS scan. Set the moment a status arrives, cleared when
  # a new tag is read. See flash_read for why the flash cannot simply assume it
  # is still the most recent thing to have happened.
  - id: answered
    type: bool
    restore_value: false
    initial_value: "false"
  # Whether the cartridge currently on the reader was ever announced.
  #
  # Keeps insert and remove symmetrical. One left on the reader through a power
  # cut is deliberately not announced, so lifting it must not send a removal
  # either — that would run the lift-off action against whatever happened to be
  # playing, for a cartridge the add-on never knew was there.
  - id: announced_insert
    type: bool
    restore_value: false
    initial_value: "false"

  # Whether Home Assistant has connected at any point since this boot.
  #
  # What separates "a cartridge was left on the reader" from "somebody just put
  # one on". The RC522 is alive long before wifi, so the first read after a
  # power cut is always the former — and that one is recorded, not acted on.
  - id: ever_connected
    type: bool
    restore_value: false
    initial_value: "false"

  # ---- palette -----------------------------------------------------------
  #
  # Nine states, in this order. The add-on pushes colours for all of them; the
  # values here are the fallback, and are what shows if the add-on has never
  # connected since this board booted.
  #
  #   0 no wifi     1 no Home Assistant   2 ready
  #   3 tag read    4 working             5 no answer
  #   6 playing     7 not set up          8 error
  #   9 paused
  #
  # RAM, not flash. If the reader reboots with the add-on down it falls back to
  # these — the right trade, because the states that matter when everything is
  # broken are exactly the ones nobody customises. Writing to flash every time
  # somebody dragged a colour picker would be worse.
  - id: pal_r
    type: float[11]
    restore_value: false
    initial_value: "{1.0f, 1.0f, 1.0f, 1.0f, 1.0f, 1.0f, 0.0f, 0.10f, 1.0f, 0.0f, 0.0f}"
  - id: pal_g
    type: float[11]
    restore_value: false
    initial_value: "{0.0f, 0.55f, 1.0f, 1.0f, 1.0f, 0.55f, 1.0f, 0.35f, 0.0f, 1.0f, 1.0f}"
  - id: pal_b
    type: float[11]
    restore_value: false
    initial_value: "{0.0f, 0.0f, 1.0f, 1.0f, 1.0f, 0.0f, 0.15f, 1.0f, 0.0f, 0.15f, 0.15f}"
  - id: pal_br
    type: float[11]
    restore_value: false
    initial_value: "{0.45f, 0.45f, 0.10f, 1.0f, 0.40f, 0.80f, 0.70f, 0.60f, 0.80f, 0.18f, 0.40f}"

  # How each state moves: 0 steady, 1 slow breathe, 2 fast pulse. NOT
  # configurable — motion is what separates two states that share a colour.
  # Red slow is "no wifi" and red fast is "something failed"; amber slow is "no
  # Home Assistant" and amber fast is "Home Assistant is there, the add-on is
  # not answering". Handing that to a colour picker would lose it.
  - id: pal_motion
    type: uint8_t[11]
    restore_value: false
    initial_value: "{1, 1, 0, 0, 1, 2, 0, 1, 2, 0, 1}"

  # A colour sampled from the playing cartridge's artwork, when the add-on sends
  # one. Overrides the palette for the playing state only — every other state
  # means the same thing whatever is on the reader, so borrowing a cartridge's
  # colour for them would say nothing.
  - id: accent_r
    type: float
    restore_value: false
    initial_value: "0.0f"
  - id: accent_g
    type: float
    restore_value: false
    initial_value: "0.0f"
  - id: accent_b
    type: float
    restore_value: false
    initial_value: "0.0f"
  - id: accent_on
    type: bool
    restore_value: false
    initial_value: "false"

  # Working values for the breathe script, filled in by `paint`.
  - id: breathe_hi
    type: float
    restore_value: false
    initial_value: "0.4f"
  - id: breathe_lo
    type: float
    restore_value: false
    initial_value: "0.04f"
  - id: breathe_ms
    type: int
    restore_value: false
    initial_value: "900"

rc522_spi:
  cs_pin: GPIO5
  update_interval: 250ms

  on_tag:
    then:
      # Cancel any pending removal first: a card resting on the reader drops out
      # of the field intermittently, and this is what turns that flicker into a
      # no-op instead of an event storm (§2.1).
      - script.stop: removal_debounce

      - if:
          condition:
            lambda: "return id(current_uid) != x || !id(card_present);"
          then:
            - lambda: |-
                id(current_uid) = x;
                id(card_present) = true;
            - text_sensor.template.publish:
                id: cartridge_id
                state: !lambda "return x;"
            - binary_sensor.template.publish:
                id: cartridge_present
                state: true

            # A cartridge LEFT on the reader is not a cartridge being played.
            #
            # The RC522 reads it within a second of power returning, long before
            # wifi, so every boot with one seated used to look like somebody had
            # just tapped it — and start playing. Nobody asked for that: the
            # room was quiet, and something began.
            #
            # No flash either. There is nobody standing over it to see one, and
            # it turned a power cut into a light show ending in amber. Lift it
            # and put it back to play it, which is the same gesture as always.
            - lambda: |-
                ESP_LOGI("reader", "cartridge on: %s%s", x.c_str(),
                         id(ever_connected) ? "" : " (left from before, ignoring)");
            - if:
                condition:
                  lambda: "return id(ever_connected);"
                then:
                  # Flash locally, before anything touches the network.
                  # Confirmation that the tag was READ must not depend on HA
                  # being up (§2.1). What happens next does, and arrives later
                  # as a colour.
                  - script.execute: flash_read
                  - homeassistant.event:
                      event: esphome.nfc_card_inserted
                      data:
                        uid: !lambda "return x;"
                        # Which reader this came from. Both readers in a house
                        # fire the same event type, so without this the add-on
                        # cannot tell a tap in the lounge from one in the
                        # bedroom. Deliberately `device_name` and not something
                        # new: Home Assistant derives this reader's light
                        # actions from the same string, so one value ties the
                        # tap and the light it should drive together.
                        device: "${device_name}"
                  - lambda: "id(announced_insert) = true;"

  on_tag_removed:
    then:
      - script.execute: removal_debounce

script:
  # Removal debounce (§2.1). Restarted rather than queued, so repeated drop-outs
  # collapse into one pending removal.
  #
  # 1500ms, not the original 500. The reader misses polls — the log says so
  # outright, "rc522: Communication takes longer than update interval" — and at
  # a 250ms interval two missed polls in a row is 500ms of silence from a
  # cartridge that never moved. The removal was then declared while it sat
  # there, and the next good read looked like a fresh tap: a cartridge lifted
  # off a quiet reader started playing on the way out.
  #
  # Six missed polls is a far higher bar than two, and the cost is that lifting
  # a cartridge takes a second longer to register. Coupling is worst exactly
  # while a cartridge is being lifted, which is why this surfaced there.
  - id: removal_debounce
    mode: restart
    then:
      - delay: 1500ms
      - if:
          condition:
            lambda: "return id(card_present);"
          then:
            # Only if its arrival was announced. See `announced_insert`.
            - if:
                condition:
                  lambda: "return id(announced_insert);"
                then:
                  - homeassistant.event:
                      event: esphome.nfc_card_removed
                      data:
                        uid: !lambda "return id(current_uid);"
                        device: "${device_name}"
            - lambda: |-
                ESP_LOGI("reader", "cartridge lifted: %s", id(current_uid).c_str());
                id(card_present) = false;
                id(current_uid) = "";
                id(announced_insert) = false;
            - binary_sensor.template.publish:
                id: cartridge_present
                state: false
            - text_sensor.template.publish:
                id: cartridge_id
                state: ""
            # Lifting a cartridge clears every held state — error, not-set-up,
            # no-answer. It is the universal "reset the light" gesture, which
            # beats hunting for a button.
            - script.stop: answer_timeout
            - script.stop: error_clear
            - lambda: |-
                id(holding) = false;
                id(awaiting) = false;
            - script.execute: show_ambient

  # ---- painting ----------------------------------------------------------

  # Applies one palette entry. The single place the LED is ever written.
  #
  # Every state has to set all four of rgb, color_brightness, white and
  # brightness. What reaches the LED is:
  #
  #     colour dies = brightness x color_brightness x rgb
  #     white die   = brightness x white
  #
  # and both switches persist until written, so a state that sets only what it
  # cares about inherits the rest from whatever ran before it.
  #
  # A grey — red, green and blue equal — is driven through the white die rather
  # than by mixing the three colour dies. Mixed white on this part has a faint
  # iridescence that shifts with viewing angle and never lands on neutral; the
  # white die exists to avoid exactly that. It also means the settings screen
  # never has to explain RGBW to anyone: pick white, get the white die.
  #
  # Note what is NOT here: set_rgb(0, 0, 0) to mean "no colour". A colour with
  # no channels is meaningless, so ESPHome normalises it to full white and
  # lights all three colour dies — the opposite of the intent, and it reads
  # correctly right up until you look at the LED.
  - id: paint
    mode: restart
    parameters:
      idx: int
    then:
      - script.stop: breathe
      - lambda: |-
          if (!id(status_auto).state || idx < 0 || idx > 10) return;

          // Playing, paused and waiting are the three states a cartridge may
          // colour itself: all three are about that cartridge. Every other
          // state means the same thing whatever is on the reader.
          const bool accent =
              ((idx == 6 || idx == 9 || idx == 10) && id(accent_on));
          const float r = accent ? id(accent_r) : id(pal_r)[idx];
          const float g = accent ? id(accent_g) : id(pal_g)[idx];
          const float b = accent ? id(accent_b) : id(pal_b)[idx];
          // Brightness stays the palette's. Artwork decides the hue; how bright
          // the reader gets is a room decision, not a cover-art one.
          const float level = id(pal_br)[idx];
          const bool grey = (r == g && g == b);

          auto call = id(status_led).turn_on();
          call.set_rgb(grey ? 1.0f : r, grey ? 1.0f : g, grey ? 1.0f : b);
          call.set_color_brightness(grey ? 0.0f : 1.0f);
          call.set_white(grey ? 1.0f : 0.0f);
          call.set_brightness(level);
          call.perform();

          // Breathing dips to a tenth of the state's own brightness, so a dim
          // state breathes gently and a bright one breathes obviously.
          id(breathe_hi) = level;
          id(breathe_lo) = level * 0.1f;
          id(breathe_ms) = (id(pal_motion)[idx] == 2) ? 250 : 900;
      - if:
          condition:
            lambda: |-
              return id(status_auto).state && idx >= 0 && idx <= 10 &&
                     id(pal_motion)[idx] != 0;
          then:
            - script.execute: breathe

  # Ramps between the two brightnesses `paint` worked out. The light component
  # interpolates, so this is two calls per cycle rather than a busy loop.
  - id: breathe
    mode: restart
    then:
      - while:
          condition:
            lambda: "return true;"
          then:
            - light.turn_on:
                id: status_led
                brightness: !lambda "return id(breathe_lo);"
                transition_length: !lambda "return id(breathe_ms);"
            - delay: !lambda "return id(breathe_ms);"
            - light.turn_on:
                id: status_led
                brightness: !lambda "return id(breathe_hi);"
                transition_length: !lambda "return id(breathe_ms);"
            - delay: !lambda "return id(breathe_ms);"

  # ---- states ------------------------------------------------------------

  # What the reader shows when nothing is happening — which is almost always,
  # so it doubles as the "is this thing alive" indicator.
  - id: show_ambient
    mode: restart
    then:
      - if:
          condition:
            lambda: "return !id(holding);"
          then:
            - script.execute:
                id: paint
                idx: !lambda |-
                  if (id(link_up)) return 2;   // ready
                  if (id(net_up)) return 1;    // no Home Assistant
                  return 0;                    // no wifi

  # A tag came off the reader chip. Says nothing about what it will play.
  - id: flash_read
    mode: restart
    then:
      - lambda: "id(answered) = false;"
      - script.execute:
          id: paint
          idx: 3
      - delay: 120ms
      # Only wait for an answer that has not already arrived — and only if
      # there is anything out there to answer.
      #
      # The add-on replies in well under this flash — about 50ms for a tag it
      # recognises as unassigned. Entering the working state unconditionally
      # therefore overwrote a status that had ALREADY come back, and re-armed a
      # timer nothing would ever clear: blue for a moment, then white breathing,
      # then amber claiming nobody had answered. Which was untrue, and was the
      # firmware's own doing.
      - if:
          condition:
            lambda: "return !id(answered) && id(link_up);"
          then:
            - script.execute: enter_working

  # The Test Light button. A flash and back to ambient, nothing more.
  - id: test_flash
    mode: restart
    then:
      - script.execute:
          id: paint
          idx: 3
      - delay: 120ms
      - script.execute: show_ambient

  # Fired the event, waiting for someone to answer it.
  #
  # This exists because the add-on cannot report its own absence. With it
  # stopped, Home Assistant is still connected, so the reader would sit at
  # "ready", you would tap a cartridge, get a flash, and then silence — for
  # ever, with nothing anywhere saying why.
  - id: enter_working
    mode: restart
    then:
      - lambda: |-
          id(holding) = true;
          id(awaiting) = true;
      - script.execute:
          id: paint
          idx: 4
      # Short, because all it asks is "did anything hear me". The add-on
      # answers `busy` within a few hundred milliseconds and that extends the
      # wait — so this timer never has to outlast the TV launch delays, which
      # are settings and could be raised past any fixed value chosen here.
      - script.execute:
          id: answer_timeout
          ms: 3000

  - id: answer_timeout
    mode: restart
    parameters:
      ms: int
    then:
      - delay: !lambda "return ms;"
      - if:
          condition:
            lambda: "return id(awaiting);"
          then:
            - lambda: "id(holding) = true;"
            - script.execute:
                id: paint
                idx: 5

  # Held states clear themselves after a while, so the reader cannot sit there
  # reporting a fault that was fixed an hour ago.
  - id: error_clear
    mode: restart
    then:
      - delay: 30s
      - lambda: "id(holding) = false;"
      - script.execute: show_ambient

  # Called by the add-on once it knows what the cartridge actually did.
  #
  # Unknown names fall through to ambient rather than sticking, so a newer
  # add-on cannot strand older firmware showing a colour it cannot clear.
  - id: show_status
    mode: restart
    parameters:
      state: string
    then:
      - script.stop: answer_timeout
      - script.stop: error_clear
      - lambda: |-
          if (!id(status_auto).state) return;
          // Whatever this is, something out there is listening.
          id(answered) = true;

          // "playing" clears itself after a moment; "playing_hold" stays lit
          // for as long as the cartridge is on the reader. Which one arrives
          // is the add-on's setting to make, not the firmware's to guess.
          if (state == "busy") {
            id(holding) = true;
            // Set here rather than inherited from enter_working, which may have
            // been skipped by the guard in flash_read. "Busy" means someone is
            // working on it, so the long backstop should be armed either way.
            id(awaiting) = true;
          } else if (state == "playing") {
            id(holding) = false;
            id(awaiting) = false;
          } else if (state == "playing_hold" || state == "paused" ||
                     state == "waiting" || state == "new" || state == "error") {
            id(holding) = true;
            id(awaiting) = false;
          } else {
            id(holding) = false;
            id(awaiting) = false;
          }
      - script.execute:
          id: paint
          idx: !lambda |-
            if (state == "busy") return 4;
            if (state == "playing" || state == "playing_hold") return 6;
            if (state == "new") return 7;
            if (state == "error") return 8;
            if (state == "paused") return 9;
            if (state == "waiting") return 10;
            return -1;                        // ambient handles the rest
      - if:
          condition:
            lambda: 'return state == "busy";'
          then:
            # Something is on the other end, so stop asking whether anyone is
            # listening and simply wait. The backstop only catches an add-on
            # that answers and then dies mid-launch.
            - script.execute:
                id: answer_timeout
                ms: 60000
      - if:
          condition:
            lambda: 'return state == "error";'
          then:
            - script.execute: error_clear
      - if:
          condition:
            lambda: 'return state == "playing";'
          then:
            - delay: 2s
            - script.execute: show_ambient
      - if:
          condition:
            lambda: |-
              return state != "busy" && state != "playing" &&
                     state != "playing_hold" && state != "paused" &&
                     state != "waiting" && state != "new" && state != "error";
          then:
            - script.execute: show_ambient

  # ---- palette ------------------------------------------------------------

  # Eight hex characters per state — RRGGBBLL — in the order documented on the
  # palette globals. LL is brightness, 00 to FF.
  #
  # Fixed width and fixed order so the parse is a loop rather than a grammar.
  # A SHORT palette is accepted and applied as far as it goes: an add-on that
  # predates the paused state sends nine entries, and the tenth should keep its
  # default rather than the whole push being thrown away. Anything that is not a
  # whole number of entries, or longer than this firmware knows about, is
  # ignored entirely — a malformed push leaves a working light, not a dark one.
  - id: apply_palette
    mode: restart
    parameters:
      packed: string
    then:
      - lambda: |-
          const int entries = packed.length() / 8;
          if (packed.length() % 8 != 0 || entries < 1 || entries > 11) {
            ESP_LOGW("palette", "ignored: %u chars is not 1-11 entries of 8",
                     (unsigned) packed.length());
            return;
          }

          auto nibble = [](char c) -> int {
            if (c >= '0' && c <= '9') return c - '0';
            if (c >= 'a' && c <= 'f') return c - 'a' + 10;
            if (c >= 'A' && c <= 'F') return c - 'A' + 10;
            return -1;
          };

          float r[11], g[11], b[11], br[11];
          for (int i = 0; i < entries; i++) {
            int v[8];
            for (int n = 0; n < 8; n++) {
              v[n] = nibble(packed[i * 8 + n]);
              if (v[n] < 0) {
                ESP_LOGW("palette", "ignored: bad hex at %d", i * 8 + n);
                return;
              }
            }
            r[i] = (v[0] * 16 + v[1]) / 255.0f;
            g[i] = (v[2] * 16 + v[3]) / 255.0f;
            b[i] = (v[4] * 16 + v[5]) / 255.0f;
            br[i] = (v[6] * 16 + v[7]) / 255.0f;
          }

          // Nothing is written until every entry has parsed, so a bad character
          // half way through cannot leave a half-applied palette.
          for (int i = 0; i < entries; i++) {
            id(pal_r)[i] = r[i];
            id(pal_g)[i] = g[i];
            id(pal_b)[i] = b[i];
            id(pal_br)[i] = br[i];
          }
          ESP_LOGI("palette", "applied %d entries", entries);
      # Show the new colours at once rather than at the next event, so dragging
      # a colour picker in the add-on is visible on the reader immediately.
      - script.execute: show_ambient

# ---------------------------------------------------------------------------
# Entities
# ---------------------------------------------------------------------------

switch:
  # The hand-over. On, the reader owns the light and shows what it is doing.
  # Off, the firmware stops touching it entirely and it is yours to drive from
  # Home Assistant — including the read flash and the add-on's colours, which
  # would otherwise stamp on whatever you set a second later.
  - platform: template
    id: status_auto
    name: "Status Light Automatic"
    icon: mdi:auto-fix
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      # Take the light straight back rather than waiting for the next event.
      - script.execute: show_ambient
    on_turn_off:
      # Otherwise a breathing state keeps ramping underneath you.
      - script.stop: breathe

text_sensor:
  - platform: template
    id: cartridge_id
    name: "Cartridge ID"
    icon: mdi:nfc-variant

binary_sensor:
  - platform: template
    id: cartridge_present
    name: "Cartridge Present"
    device_class: presence

button:
  - platform: template
    name: "Test Light"
    icon: mdi:lightbulb-on-outline
    on_press:
      # Deliberately NOT flash_read: no tag was read, so nothing is coming back,
      # and waiting for an answer would end in "no answer" every time.
      - script.execute: test_flash

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
